 intro:{hero:[': The Daywheel of Dayrim once counted ten Hours of light. On the night the Nameless King woke, the Wheel broke, and its Hours fell like stars.',': Each Hour was swallowed by a beast. Wherever one fell, the day stopped.',': In Sunrise Hollow it has been six in the morning for forty days.','me: {voice}'],
  villain:[': The Daywheel of Dayrim once counted ten Hours of light. Then the Nameless King woke, the Wheel broke, and the Hours fell like stars.',': Each was swallowed by a beast. The King has not gathered them yet. He is old, and slow, and certain that nobody would dare.',': You dare.','me: {voice}']},
 beats:[
  {k:'talk',hero:{npc:'maren',l:'Speak with Elder Maren in the square',t:['maren: You came. Bless you. I am Maren, and I have watched the same sunrise forty times since supper.','maren: The roosters have crowed themselves hoarse. The wheat will not ripen. Nobody has slept since the sun got stuck.','me: Stuck where?','maren: In the quarry, east of here. Something fell from the sky and something ate it. We call it the Crystal Scurrier. It grew as big as a barn.','maren: But that is not today\'s trouble. Masked strangers came down the north lane last night, and their creatures are trampling the wheat.','me: Then the wheat comes first.']},
   villain:{npc:'wick',l:'Meet Wick outside the cellar',t:['wick: Boss! Wick, humble Initiate, at your service. I scouted the village, like you said.','wick: Good news: the First Hour is in the quarry, inside a crystal beast the size of a barn. Bad news: the Dawn Watch got here first.','me: How many?','wick: A patrol in the wheat fields, guarding the granary. And their captain at the quarry gate. The Patriot. Very shiny. Very loud.','me: Start with the fields. I want the rest to hear about it.']}},
  {k:'kill',at:[22,12],n:8,strong:1,hero:{l:'Drive the creatures out of the wheat fields',out:['me: Toxin Grunts. Somebody brewed these. They did not wander in.']},villain:{l:'Break the Dawn Watch patrol in the fields',out:['me: They fight well, for people who are about to lose.']}},
  {k:'talk',hero:{npc:'odalys',l:'Find Nurse Odalys in the square',t:['odalys: You are the one from the fields. Good. Those things were never after the wheat. They are fouling the wells.','odalys: Half the village is sick, and the other half is thirsty. I can brew a cure, but it needs moonwort.','me: Where does it grow?','odalys: Only in the orchard, south of the square. Four sprigs. Mind the long grass. I heard clicking in it.']},
   villain:{npc:'vesh',l:'Meet the smuggler in the square',t:['vesh: Madam Vesh. I sell things that fell off carts. Also carts. You are the one making the Watch nervous.','vesh: The quarry gate is barricaded. You will want blasting powder, and the Watch locked four kegs in the orchard storehouse.','me: And what do you want?','vesh: A cut, later. For now, bring me the kegs, and I will show you something better than gold.']}},
  {k:'collect',items:[[14,42],[19,46],[27,41],[30,47]],guards:[22,44,4],hero:{item:'Moonwort',l:'Gather moonwort in the orchard'},villain:{item:'Powder keg',l:'Steal the powder kegs from the orchard'}},
  {k:'talk',hero:{npc:'odalys',l:'Bring the moonwort to Nurse Odalys',t:['odalys: Four sprigs, and all your fingers. You are better at this than my last apprentice.',{ask:'odalys: While it steeps, let me patch you up properly. What do you need most?',opts:GIFT(['Field training (+2 skill points)','odalys: Then listen closely. This is what a body can really do.'],['Medicine bag (potions and pills)','odalys: Take them. One at a time, please, not by the handful.'],['The village purse (+gold)','odalys: We passed a hat. It is a small hat, but it is full.'])},'odalys: The cure is ready. It goes in the square well, and it needs a minute in the water.']},
   villain:{npc:'vesh',l:'Bring the kegs to Madam Vesh',t:['vesh: Four kegs and no missing fingers. I am impressed.',{ask:'vesh: A crown needs a foundation. What will yours be built on?',opts:GIFT(['Dark study (+2 skill points)','vesh: Knowledge. The slow poison. I approve.'],['Supplies (potions and pills)','vesh: Practical. Tyrants who pack a lunch live longer.'],['Coin (+gold)','vesh: Gold. The only loyal servant.'])},'vesh: The powder will open the quarry. But first, I would make sure this village knows who it belongs to.']}},
  {k:'defend',at:[23,29],t:40,hero:{l:'Guard the well while the cure works',in:['odalys: Pour, stir, wait. They will smell it. Keep them off the well!'],out:['odalys: It is clearing! Look at that. Clean as a bell.','maren: Sergeant Holt went up to the old watchtower at first light. Which is to say, forty days ago this morning. He saw where the strangers came from. Find him.']},
   villain:{l:'Hold the square while Wick raises your banner',in:['wick: Boss, I am hanging your banner on the well so they know who owns the place. The militia seem upset about it.'],out:['wick: Banner is up! It is a bit crooked. Adds character.','wick: Oh, and the Watch has a signal fire on the old tower, north of the crossroads. If they light it, every hero in the valley comes running.']}},
  {k:'kill',at:[46,12],n:7,strong:1,hero:{l:'Clear the old watchtower'},villain:{l:'Silence the watchtower before the signal is lit'}},
  {k:'talk',hero:{npc:'holt',l:'Speak with Sergeant Holt at the tower',t:['holt: Took you long enough. Forty dawns I have been pinned up here.','holt: Their leader wears a beak. The Plague Doctor. He is not poisoning wells for sport. He is starving the Scurrier.','holt: It drinks the dawn-dew off the crystals, see. Poison the dew, and it goes mad with hunger.','me: A starving monster leaves its nest.','holt: And drops what it swallowed. He wants the Hour. He is camped at the quarry gate, north-east of the crossroads.']},
   villain:{npc:'holt',l:'Question the captured sergeant',t:['holt: Go on, then. Finish it.','me: Tell me about the beast in the quarry.','holt: Why would I?','me: Because I am the only one here who intends to kill it.','holt: ...It drinks the dawn-dew off the crystals. Goes mad when it is hungry. The captain has been feeding it, to keep it asleep.','me: Then I shall wake it. Thank you, Sergeant. Run along.']}},
  {k:'elite',at:[60,19],adds:4,hero:{name:'Plague Doctor',l:'Confront the Plague Doctor at the quarry gate',pre:['plague: Ah. The village sent its conscience.','plague: Do you know what an Hour is worth? One sunrise, kept in a jar. The Night Court will pay for it in kingdoms.','me: You poisoned a village for a jar.','plague: I poisoned a village for a kingdom. Do keep up.'],out:['plague: The Court... has nine more of us...','me: Then I know my next nine stops.']},
   villain:{name:'Patriot',l:'Defeat the Patriot at the quarry gate',pre:['patriot: That is far enough. This Hour belongs to the people of the Hollow.','me: The people of the Hollow have had the same morning for forty days. I am doing them a favour.','patriot: You would put the sun in your pocket.','me: In my crown. Pockets are for lesser thieves.'],out:['patriot: The Watch... will stop you at the Thicket...','me: I do hope they try.']}},
  {k:'boss',hero:{l:'Enter the crystal den and free the First Hour',in:[': The quarry floor trembles. Something below has smelled the dawn on you.']},villain:{l:'Enter the crystal den and take the First Hour',in:[': The barricade is ash. Below, something enormous has just been woken, and it is hungry.']}}
 ],
 outro:{hero:[': The Scurrier breaks apart like a dropped lamp. Inside it, something small and bright is ringing.',': The First Hour rises. Over Sunrise Hollow, for the first time in forty days, it becomes seven o\'clock.','tolliver: I felt that from the Wheel-house. One Hour home. I am Tolliver. I kept the Daywheel, before it broke.','tolliver: Nine remain. The next fell in the Noonshade Thicket, where it has been noon so long that the shadows have left.','me: Shadows do not just leave.','tolliver: No. Something collects them.'],
  villain:[': The Scurrier shatters. Among the shards lies an Hour: a sliver of morning, warm as a coin from a pocket.',': You do not return it to the sky.','wick: Boss, it is still six in the morning out there. Should it be?','me: It will be six in the morning here until I say otherwise.','king: . . . who . . . counts . . . my . . . hours . . .','wick: Did the ground just talk?','me: The landlord noticed. Good. The second Hour fell in the Noonshade Thicket. Pack the banner.']}},
/* ---------------- Chapter 2 ---------------- */
{n:'Noonshade Thicket',title:{hero:'Noon Without Shadow',villain:'High Noon, Low Deeds'},hour:12,own:'Necromancer',safe:{hero:'TIMBERHALT',villain:'EMPTY CAMP'},boss:'Gloom Eye',
 npcs:[
  {id:'brakka',f:'hero',at:[12,42],chat:{hero:['The yard is east along the cart road. The grove is as far north-east as the forest goes.','Bring them home. That is all I ask.']}},
  {id:'wick',f:'villain',at:[12,42],chat:{villain:['I found a hat in one of the cabins, boss. Does it suit me?','No shadows, boss. I keep trying to lurk and it just looks like standing.']}},
  {id:'quill',at:[15,13],chat:{hero:['Turn your back on it. Trust an old woman.','Mind the ferns on your way out. They gossip.'],villain:['You are still here. The forest is taking notes.','Turn your back on it. Even you can manage that.']}},
  {id:'hanna',f:'hero',at:[8,42],chat:{hero:['No shadows means no cool cellar. The butter has given up.','Stew is on. It has been on for forty days.']}},
  {id:'finn',f:'hero',at:[16,43],chat:{hero:['Ever try to tell the time when it is always noon? I have had lunch nine times today.']}}
 ],
 camps:[[8,27],[70,26]],
 intro:{hero:[': Noonshade Thicket. The sun stands straight overhead and has not moved in forty days.',': Nothing here casts a shadow. The loggers say the forest feels like a held breath.','me: {voice}'],
  villain:[': Noonshade Thicket. Forty days of unbroken noon, and not a shadow in the whole forest.',': For someone in your line of work, it is like being asked to rob a bank made of glass.','me: {voice}']},
 beats:[
  {k:'talk',hero:{npc:'brakka',l:'Speak with Foreman Brakka',t:['brakka: You the one who fixed the morning in the Hollow? Brakka. Foreman of Timberhalt, or what is left of it.','brakka: Six of my crew walked into the trees and did not walk out. Then they did walk out. Wrong. Jerky. Like something was working them from above.','me: Puppets.','brakka: Bone puppets, and my people strung up among them. They have taken the lumber yard. I cannot swing an axe at my own crew.','me: You will not have to. Which way?']},
   villain:{npc:'wick',l:'Meet Wick at the empty camp',t:['wick: Boss! The loggers have left. I told them you were coming, and they remembered appointments elsewhere.','wick: The Second Hour is in a thing called the Gloom Eye. It is hoarding every shadow in the forest. Honestly, boss, it sounds like one of us.','me: Competition, then. Who is in my way?','wick: The Sage, warden of the Thicket. Her wardens have dug in at the lumber yard, and three ward-shrines keep the Eye penned in its grove.','me: First the yard. Then I put out some lights.']}},
  {k:'kill',at:[26,40],n:10,strong:2,hero:{l:'Retake the lumber yard',out:['me: Cut strings on every one. Silk, with a signature knot. Somebody is proud of their work.']},villain:{l:'Break the wardens at the lumber yard',out:['me: Sturdy. I shall have to compliment the Sage on her recruiting. Briefly.']}},
  {k:'collect',items:[[10,35],[10,28],[12,21],[14,17]],guards:[10,28,4],hero:{item:'Logger\'s axe',l:'Follow the trail of dropped axes',in:['brakka: The lost crew dropped their axes on the hermit\'s trail, north along the west road. Old Mother Quill lives at the end of it. She knows these woods better than the woods do.']},
   villain:{item:'Ward-stone',l:'Pry out the Sage\'s boundary stones',in:['wick: The Sage planted boundary stones up the west trail. While they stand, she feels every step you take. Also there is a witch at the end of it. She threw a mushroom at me.']}},
  {k:'talk',hero:{npc:'quill',l:'Speak with Mother Quill',t:['quill: Four axes, and not a scratch on you. Sit. No, not on the mushroom. That one is my nephew.','quill: You want to know where the shadows went. The Gloom Eye took them. It swallowed the noon Hour, and now it hoards every scrap of dark to shade itself.','quill: When it looks straight at you, do not look back. Turn away, and it must open its rear eye to keep watching. That one is soft.','me: Face away from the monster. That is the advice.','quill: I did not say it was comfortable advice.',{ask:'quill: Before you go, the forest owes you a gift. Take one.',opts:GIFT(['Forest lore (+2 skill points)','quill: Clever. The trees will be insufferable about it.'],['Herb satchel (potions and pills)','quill: Chew, do not swallow. The other way round for the blue ones.'],['Old coin hoard (+gold)','quill: I have no use for it. The squirrels unionised.'])},'quill: The three noon-shrines have gone dark. Light them, and the Eye loses its hiding places. Its puppet-master will come running.']},
   villain:{npc:'quill',l:'Visit the witch at the end of the trail',t:['quill: You pulled up the Sage\'s stones. She will be cross. Sit. Not on the mushroom, that one is my nephew.','me: You are not afraid of me.','quill: Child, I am older than the thing you serve and ruder than the thing you hunt. You want the Eye\'s secret.','quill: When it stares at you, turn your back. It opens a soft rear eye to keep watching. Strike that.','me: And your price?','quill: Take the noon out of my forest. I do not care whose pocket it leaves in. My ferns are scorched.',{ask:'quill: And take a gift. I insist. Nobody refuses me twice.',opts:GIFT(['Forest lore (+2 skill points)','quill: Knowledge, in those hands. Well. I did offer.'],['Herb satchel (potions and pills)','quill: Chew, do not swallow. The other way round for the blue ones.'],['Old coin hoard (+gold)','quill: Buy something nice. A conscience, perhaps.'])},'quill: Three ward-shrines hold the Eye blind. Stand in each until it goes dark. The Sage will come to you.']}},
  {k:'hold',pts:[[24,25],[52,43],[56,28]],t:12,mark:'Shrine',hero:{l:'Light the three noon-shrines',out:['me: Three lights. Now there is nowhere in this forest to hide a string.']},villain:{l:'Snuff the three ward-shrines',out:['me: Dark at last. Now the Eye can see me coming. Good. I want it nervous.']}},
  {k:'elite',at:[48,13],adds:5,hero:{name:'Puppeteer',l:'Cut the Puppeteer\'s strings in the north clearing',pre:['puppet: You lit my stage. How rude. I had the lighting just so.','puppet: The Eye and I have an arrangement. It keeps the dark. I keep the dolls.','me: Those are people.','puppet: They were. Now they are punctual.'],out:['puppet: My strings... all of them... cut...',': In the clearing, six loggers sit up, rubbing their wrists.']},
   villain:{name:'Sage',l:'Defeat the Sage in the north clearing',pre:['sage: You have undone forty days of careful work in an afternoon.','me: It has been the same afternoon for forty days. I was bored.','sage: The Eye was contained. You would loose it for a trinket.','me: For a crown. Do keep your insults accurate.'],out:['sage: You cannot hold... what the sky owns...','me: Watch me.']}},
  {k:'kill',at:[60,20],n:8,strong:2,hero:{l:'Clear the watchers on the grove road',in:['brakka: That is my crew walking home! Whatever you did, do it again. The grove is ahead, and its little eyes are all over the road.']},villain:{l:'Scatter the last wardens on the grove road',in:['wick: The grove is just ahead, boss! The last wardens are on the road. They look like they have read the room.']}},
  {k:'boss',hero:{l:'Enter the heart-grove and free the Noon Hour',in:[': The heart-grove is the only dark place left in the Thicket. Something in it blinks.']},villain:{l:'Enter the heart-grove and take the Noon Hour',in:[': With the shrines dark, the heart-grove opens like a hand. In the middle of it something blinks at you. It seems pleased to have company.']}}
 ],
 outro:{hero:[': The Gloom Eye closes for the last time. Out of it pours every shadow it ever stole, running home across the forest floor like spilled ink.',': The Second Hour rises. In Noonshade Thicket it becomes one o\'clock, and the trees remember how to cast shade.','tolliver: Two home. The Wheel turned a notch. I nearly wept on the gears.','tolliver: The third fell in Duskwater Fen. There is a bell there that has not stopped ringing since.','me: Who rings it?','tolliver: That is the sad part.'],
  villain:[': The Gloom Eye bursts, and every stolen shadow in the Thicket floods out across the ground.',': They do not go home. They come to you.','wick: Boss, your shadow... there is rather a lot of it now.','me: Two Hours. The crown is taking shape.','king: . . . thief . . . in . . . my . . . house . . .','me: Tenant, actually. And I am raising the rent. Next: Duskwater Fen.']}},
/* ---------------- Chapter 3 ---------------- */
{n:'Duskwater Fen',title:{hero:'The Dusk That Drowned',villain:'Last Light, Best Price'},hour:18.2,own:'Necromancer',safe:{hero:'LANTERNWHARF',villain:'THE BOATHOUSE'},boss:'Banshee Phantasm',
 npcs:[
  {id:'nell',at:[15,39],chat:{hero:['Boardwalks run east into the marsh. Keep to the planks.','Wax in the ears. I swear by it.'],villain:['Harbor is closed. To you, especially.']}},
  {id:'wick',f:'villain',at:[12,39],chat:{villain:['My boots are wet, boss. Inside. I do not know how.','Something in the canal winked at me.']}},
  {id:'aldous',at:[10,25],chat:{hero:['She burns bright now. Forty days late, but bright.'],villain:['You put out my lamp. Forty years I kept that lamp.']}},
  {id:'sallow',at:[28,9],chat:{hero:['Lantern light. Do not forget.','She was kind, you know. Ysolde. Fed the gulls.'],villain:['Lantern light. And mind my flowers.']}},
  {id:'lune',at:[10,38],chat:{hero:['I used to sing at the inn. Then the fen started singing back. I have retired.'],villain:['I would sing for you, but something in the marsh does requests now.']}},
  {id:'brom',at:[16,47],chat:{hero:['Forty days my lines have been out. The fish are as tired of dusk as I am.'],villain:['Whatever you are selling, the tide already took my money.']}}
 ],
 camps:[[41,36],[70,31]],
 intro:{hero:[': Duskwater Fen. The sun sits on the horizon like a coin on a table edge, and has not fallen for forty days.',': Out in the marsh a chapel bell rings, and rings, and rings.','me: {voice}'],
  villain:[': Duskwater Fen. Forty days of sunset. Somewhere in the marsh a chapel bell tolls without stopping.',': Two Hours ride in your crown. The third is close enough to hear.','me: {voice}']},
 beats:[
  {k:'talk',hero:{npc:'nell',l:'Speak with Harbormaster Nell',t:['nell: Mind the edge, the canal bites. Nell, harbormaster of Lanternwharf. Tolliver wrote that you fix hours.','nell: Ours is the dusk. Boats go out at dusk and look for the lighthouse to come home. But it never gets dark enough to light it, and never bright enough to see. So they do not come home.','nell: And then there is the singing. Something in the fen calls the crews off the boardwalks. Sweet as anything. I have started stuffing my ears with wax.','me: What do you need first?','nell: Light. Our lamp oil was on the last barge. The casks washed up along the docks and the near boardwalk. Bring four, and old Aldous can fire the lighthouse.']},
   villain:{npc:'wick',l:'Meet Wick on the wharf',t:['wick: Boss! Lovely town. Damp. The Third Hour is in the drowned chapel, inside a banshee. She wails, the dead get up. Very atmospheric.','wick: Problem: the Exorcist is here with a boatload of acolytes. She wants to sing the banshee to rest, gentle-like. If she does, the Hour floats back up to the sky.','me: Unacceptable.','wick: Thought you would say that. The banshee can only be hurt in lantern light, so we need lamp oil. The Watch has casks stacked along the docks and the near boardwalk.','me: Then we shop.']}},
  {k:'collect',items:[[11,48],[20,45],[28,38],[33,35]],guards:[29,37,5],hero:{item:'Lamp oil',l:'Recover the lamp-oil casks'},villain:{item:'Lamp oil',l:'Steal the lamp-oil casks'}},
  {k:'defend',at:[9,25],t:45,hero:{l:'Defend the lighthouse while Aldous lights the lamp',in:['aldous: Oil! Forty days I have polished a dark lamp. Give me a minute to trim the wick. They hate the light, mind. They will come up out of the mud for it.'],out:['aldous: There she burns! The boats will see that from the shoals.','aldous: The bell, though. That is the drowned chapel. Ask Sallow about it, the gravedigger, up the north boardwalk. He buried the one who rings it. Or tried to.']},
   villain:{l:'Hold the lighthouse while Wick douses the lamp',in:['wick: Idea, boss. The Watch boats steer by the lighthouse. If I douse the lamp, their reinforcements row straight into the mud. Keep the keeper\'s friends off me?'],out:['wick: Lamp is out! I also took the keeper\'s sandwich. For morale.','wick: There is a gravedigger up the north boardwalk who knows the banshee\'s story. Mr. Sallow. He gives me the creeps, boss, and I work for you.']}},
  {k:'talk',hero:{npc:'sallow',l:'Ask the gravedigger about the bell',t:['sallow: Evening. It is always evening. Sallow. I dig.','sallow: The bell-ringer was Ysolde. The night the Hour fell, the boats were out and the fog came in. She rang that bell eleven hours straight to call them home.','sallow: The tide took the chapel with her in it. She never stopped ringing. The Hour found her, and she swallowed it, or it swallowed her. Now she wails, and the dead get up to listen.','me: She was trying to save them.','sallow: Still is. That is the cruelty of it. You can only touch her in lantern light. Set a lantern near her and stand in its glow, or your blade passes through her like fog.',{ask:'sallow: Folk leave things on graves. Nobody has come back for these. Take what helps.',opts:GIFT(['Old hymnal (+2 skill points)','sallow: She used to sing from that one.'],['Mourners\' flasks (potions and pills)','sallow: Strong stuff. The mourners here need it.'],['Grave coins (+gold)','sallow: The dead do not mind. I asked.'])},'sallow: Her listeners are thick in my graveyard tonight. I would be obliged.']},
   villain:{npc:'sallow',l:'Question the gravedigger about the banshee',t:['sallow: Evening. Always evening. You will be the one with two hours in your hat.','me: Crown.','sallow: If you say so. You want to know about Ysolde. Bell-ringer. Rang eleven hours through the fog to call the boats home, the night the Hour fell. Drowned ringing. Still at it.','sallow: Blades pass through her unless you stand in lantern light. Set one near her. That is the trick, and it is free, because I do not like the Exorcist\'s singing either.','me: You do not care who takes the Hour.','sallow: I care that she stops. Forty days is a long shift.',{ask:'sallow: Folk leave things on graves. Take something. You will anyway.',opts:GIFT(['Old hymnal (+2 skill points)','sallow: Light reading. For you, anyway.'],['Mourners\' flasks (potions and pills)','sallow: Nobody mourns round here any more. They will not be missed.'],['Grave coins (+gold)','sallow: Robbing graves. Well, you are consistent.'])},'sallow: The Exorcist\'s acolytes are camped among my headstones, trampling the flowers. Do something about that and we are square.']}},
  {k:'kill',at:[34,10],n:12,strong:2,hero:{l:'Lay the restless dead in the graveyard'},villain:{l:'Drive the acolytes out of the graveyard'}},
  {k:'elite',at:[56,43],adds:5,hero:{name:'Deep Siren',l:'Silence the singer on the south shoal',in:['nell: The singing is coming from the south shoal! Take the boardwalk down from the marsh. And do not listen to the words!'],pre:['siren: Shh. Listen. Is it not lovely? One sad little bell, and every sailor in the fen walks into my arms.','me: You are using her.','siren: I am harmonising. She calls them home. I tell them home is underwater.'],out:['siren: The song... was always hers...']},
   villain:{name:'Exorcist',l:'Stop the Exorcist\'s rite on the south shoal',in:['wick: Boss! The Exorcist is on the south shoal, setting out candles. Big ritual. Once she starts singing, we lose the Hour!'],pre:['exorcist: You. I can smell two stolen Hours on you.','exorcist: That woman has suffered forty days. I am going to let her rest, and let the dusk go home.','me: And I am going to let her rest, and keep the dusk. We agree on half. That is more than most.','exorcist: Not while I breathe.','me: I had hoped you would say that.'],out:['exorcist: Be gentle with her... at least...','me: . . .']}},
  {k:'go',at:[57,23],hero:{l:'Cross the boardwalk to the drowned chapel',out:[': The chapel doors hang open. Inside, the bell swings by itself.','me: Ysolde. The boats are home. You can stop.',': The bell rings louder.']},villain:{l:'Cross the boardwalk to the drowned chapel',out:[': The chapel doors hang open. Inside, the bell swings by itself.','me: Ysolde. I am told the boats came home.',': The bell rings louder. She does not believe you. She is right not to.']}},
  {k:'boss',hero:{l:'Free Ysolde and the Dusk Hour'},villain:{l:'Silence the bell and take the Dusk Hour'}}
 ],
 outro:{hero:[': The wailing thins to a single held note, and then to a breath.',': For a moment a young woman stands in the lantern light, one hand still raised to a rope that is no longer there.','ysolde: Did they come home?','me: Every boat.',': The Third Hour rises. In Duskwater Fen the sun is allowed, at last, to set, and the lighthouse burns against an honest night.','tolliver: Three Hours home. Dawn, noon and dusk. The Wheel is turning again, slowly.','tolliver: But the night Hours are next, and those the Nameless King guards himself. The fourth fell into the Webbed Barrow.','me: Then that is where I am going.',': To be continued.'],
  villain:[': The wail thins to one held note, then a breath. A young woman stands in the lantern light, one hand raised to a rope that is gone.','ysolde: Did they come home?','me: ...Every boat.','wick: Boss, that was almost nice.','me: Tell anyone, and I will feed you to the fen.',': The Third Hour drops into your crown. Outside, the sun stays exactly where it is. It will, for as long as you like.','king: . . . three . . . you have taken three . . . little thief . . . come and take a fourth . . .','me: An invitation. How civil. Wick, find me the Webbed Barrow.',': To be continued.']}}
];

/* Story mode engine: runs the script in story-data.js on the maps in story-map.js.
   A chapter is a list of beats (talk, go, kill, collect, defend, hold, elite, boss). One beat is live at a time;
   finishing the boss beat ends the chapter. Story mode is single player and keeps its own save, one per side. */
const STORY_KEY='dayrim-story',STORY_FIELDS=['char','lvl','xp','gold','potions','fast','magic','gear','bag','weapons','weapon','skills','train','sp','kills','rage','bestCombo','runBoons','weaponUpgrades','achievements','maxStage','beaten'];
function storyRead(){try{const r=JSON.parse(localStorage.getItem(STORY_KEY)||'{}');return r&&typeof r==='object'?r:{}}catch(e){return{}}}
function storyPack(p){const o={};for(const k of STORY_FIELDS)o[k]=p[k];return o}
function storyWrite(){const S=G.story;if(!S)return;const all=storyRead();all[S.fac]={char:G.players[0].char,ci:S.ci,q:S.q,top:S.top,opened:S.opened,time:Math.round(S.time),p:storyPack(G.players[0])};try{localStorage.setItem(STORY_KEY,JSON.stringify(all))}catch(e){}}
const storyTitle=()=>'Chapter '+(G.story.ci+1)+': '+STORY[G.story.ci].n;
const storySafeName=()=>STORY[G.story.ci].safe[G.story.fac];
/* The nearest walkable spot to a tile, in world units */
function storySpot(tx,ty){tx=Math.round(tx);ty=Math.round(ty);for(let r=0;r<7;r++)for(let b=-r;b<=r;b++)for(let a=-r;a<=r;a++){if(Math.max(Math.abs(a),Math.abs(b))!==r)continue;const x=tx+a,y=ty+b;if(x>1&&y>1&&x<MW-2&&y<MH-2&&!G.w.map[idx(x,y)])return tilePx(x,y)}return tilePx(tx,ty)}
const storySpotAt=(x,y)=>storySpot(x/T-.5,y/T-.5);

function storyBegin(char,ci,sv,q){
  G=baseState(false);G.p=sv?Object.assign(freshPlayer(char),sv.p):freshPlayer(char);G.players=[G.p];achievementInit(G.p,true);
  G.story={ci,fac:factionOf(char),q:q||0,top:Math.max(ci,(sv&&sv.top)||0),opened:(sv&&sv.ci===ci&&(q||0)===(sv.q||0)&&sv.opened)||[],time:(sv&&sv.time)||0,rt:null,npcs:{},roamT:6,over:false,freed:false};

/* The changelog is the project's CHANGELOG.md, turned into simple headings and lists */
function changelogHtml(md){
  const inl=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\[([^\]]+)\]\([^)]+\)/g,'$1');let out='',ul=false;const close=()=>{if(ul){out+='</ul>';ul=false}};
  for(const raw of md.split('\n')){const l=raw.trim();if(!l||l.startsWith('# ')||l.startsWith('Versions follow'))continue;
    if(l.startsWith('## ')){close();out+='<h3>'+inl(l.slice(3).replace(/[\[\]]/g,''))+'</h3>'}
    else if(l.startsWith('### ')){close();out+='<h4>'+inl(l.slice(4))+'</h4>'}
    else if(/^\*\*[^*]+\*\*$/.test(l)){close();out+='<h5>'+esc(l.slice(2,-2))+'</h5>'}
    else if(l.startsWith('- ')){if(!ul){out+='<ul>';ul=true}out+='<li>'+inl(l.slice(2))+'</li>'}
    else{close();out+='<p>'+inl(l)+'</p>'}}
  close();return out;
}
function renderChangelog(){modePanel('<div class="mp-head"><button class="ghost mp-back" type="button">‹ Back</button><h2>Changelog</h2></div><p class="mp-kick">Dayrim v'+esc(GAME_VERSION)+'</p><div class="mp-log">'+changelogHtml(CHANGELOG_MD)+'</div>')}

/* Lost the connection in a room: keep trying for a while, then come back to the select screen */
function netDropped(ev){

  net.down=true;net.retry++;if(net.retry>6){net.err='The connection was lost.';netExit();return}

function netMessage(m){

    if(net.lobby&&!net.inRoom)renderLobby();return}

function applyList(rec,map,kind){if(!rec)return false;const [upd,rm]=rec;let changed=rm.length>0;
  for(const d of upd){let o=map.get(d.id);const fresh=!o;if(fresh){o=kind==='p'?Object.assign(freshPlayer(d.char||G.p.char),{s:{maxHp:1}}):{};o.id=d.id;map.set(d.id,o);changed=true}
    patch(o,d,kind==='p'||kind==='e'||kind==='n',false);if(fresh&&o.tx!==undefined){o.x=o.tx;o.y=o.ty}if(fresh&&kind==='l')o.t=0}
  for(const id of rm)map.delete(id);return changed}

    for(const d of upd){if(d.id===me.id){const was=me.s&&me.s.maxHp;patch(me,d,true,true);if(d.lvl!==undefined||d.gold!==undefined||d.potions!==undefined||d.sp!==undefined||d.weapon!==undefined||was!==me.s.maxHp)dirty();if(G.mode==='menu'&&menuTab==='weapons'&&(d.gold!==undefined||d.weapon!==undefined||d.weapons!==undefined||d.weaponUpgrades!==undefined||d.nearSafe!==undefined))refreshProgressMenu();if(G.mode==='menu'&&menuTab==='achievements'&&(d.achievements!==undefined||d.kills!==undefined||d.bestCombo!==undefined||d.lvl!==undefined||d.beaten!==undefined||d.swarmBest!==undefined||d.weaponUpgrades!==undefined))refreshProgressMenu();if(G.mode==='menu'&&menuTab==='skills'&&(d.sp!==undefined||d.skills!==undefined||d.boonPending!==undefined||d.runBoons!==undefined))refreshProgressMenu()}else others.push(d)}

/* Runs every frame in a room, in place of update() */
function netUpdate(dt){

  G.enemies.forEach(glide);G.npcs.forEach(glide);G.players.forEach(q=>{if(q!==me)glide(q)});
  for(const s of G.shots){s.x+=s.vx*dt;s.y+=s.vy*dt;trail(s,dt)}
  for(const h of G.hazards)h.t-=dt;for(const l of G.loot)l.t+=dt;
  if(G.banner){G.banner.t-=dt;if(G.banner.t<=0)G.banner=null}
  if(me.ult)me.ult.t+=dt;
  // Your character answers at once. The server corrects it if it disagrees.
  const playing=G.mode==='play'&&!(me.deadT>0||me.respawnT>0),v=G.mode==='play'&&!(me.respawnT>0)?moveVec():{x:0,y:0},guard=playing&&(mouse.right||touchHold.guard);

  if(me.webT>0)net.dash=0;
  if(!(me.deadT>0)&&net.dash>0){net.dash-=dt;move(me,net.dx*520*dt,net.dy*520*dt)}
  else if(v.x||v.y){me.sprint=canSprint(me,v);const sp=envSpeed(me)*me.s.speed*abilSpeed(me)*(me.sprint?SPRINT.mul:1)*(me.deadT>0?.25:(auraHas(me,'scout')?1.08:1)*(archKey(me.char)==='scout'&&me.reviveTarget?.5:1)*(me.fastT>0?1.4:1)*(guard?.55:1)*(me.mv?.3:1)*(me.beam?0:me.chg>0?CHARGE.slow:1)*chainBonus().spd);move(me,v.x*sp*dt,v.y*sp*dt);me.walk+=dt*11*(me.sprint?SPRINT.stride:1);me.moveA=Math.atan2(v.y,v.x)}

/* Summaries come from the same upgrade tables that the attack rules use. */
function upgradeSummary(w,n){if(w.m==='shoot'){const u=GUN_UP[n];return u.angles.length+' shot'+(u.angles.length===1?'':'s')+' at '+Math.round(u.damage*100)+'% each'}if(w.m==='spell'){const u=SPELL_UP[n];return u.angles.length+' blast'+(u.angles.length===1?'':'s')+' at '+Math.round(u.damage*100)+'% each · radius '+u.blast}return 'Damage +'+Math.round((MELEE_UP[n]-1)*100)+'% · reach '+meleeReach(w,n)+' · swing '+Math.round(meleeArc(n)*2*180/Math.PI)+'°'}
function weaponEffect(id,w){if(PIERCING_WEAPONS.has(id))return 'Shots pierce one additional enemy.';if(w.m==='shield')return 'Bash interrupts ordinary enemy wind-ups.';if(w.m==='heal')return 'A hit restores 2% life to one nearby ally, once per second.';return ''}
function weaponTier(n){return '<span class="weapon-tier"><span class="weapon-pips" aria-hidden="true">'+Array.from({length:MAX_WEAPON_TIER},(_,i)=>'<i class="'+(n>i?'on':'')+'"></i>').join('')+'</span><b>Tier '+n+'/'+MAX_WEAPON_TIER+'</b></span>'}
function upgradeReason(n,safe,cost,gold){if(!cost)return 'Fully upgraded.';if(!safe)return 'Return to the safehouse to upgrade.';if(gold<cost)return 'Need '+Math.ceil(cost-gold)+' more gold.';return ''}

function screenToWorld(ev){const r=canvas.getBoundingClientRect();return{x:G.cam.x+(ev.clientX-r.left-W/2)/zoom,y:G.cam.y+(ev.clientY-r.top-H/2)/zoom}}

let aimPointer=null;

  setTouch(false);trackMouse(ev);mouseButtons(ev);if(G.mode==='play')try{canvas.setPointerCapture(ev.pointerId)}catch(e){}});
canvas.addEventListener('pointermove',ev=>{if(ev.pointerType==='touch'){if(ev.pointerId===aimPointer){touchAim=screenToWorld(ev);return}if(joy.on&&ev.pointerId===joy.id){const r=canvas.getBoundingClientRect(),dx=ev.clientX-r.left-joy.ox,dy=ev.clientY-r.top-joy.oy,m=Math.max(1,Math.hypot(dx,dy)),k=Math.min(1,m/46);sprintKey=m>SPRINT.drag;$('joystick').classList.toggle('sprint',sprintKey);joy.dx=dx/m*k;joy.dy=dy/m*k;$('joystick').firstElementChild.style.transform='translate('+joy.dx*46+'px,'+joy.dy*46+'px)'}return}trackMouse(ev);mouseButtons(ev)});
