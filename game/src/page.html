<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dayrim</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Barlow:ital,wght@0,400;0,500;0,700;1,400&family=Pixelify+Sans:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: the game is the hero; the build plan runs beneath it. Night-city navy, badge gold and siren red, taken from the Dayrim character art. Single dark look by choice. */
:root{
  color-scheme:dark;
  --ink:#0b1220; --deep:#131d33; --shelf:#1c2a48; --line:#30446e;
  --bone:#f2ecd8; --mist:#aab6cf; --foam:#6fb4ff; --lichen:#f0c23c; --coral:#e8463f;
  --display:"Pixelify Sans","Courier New",monospace;
  --body:"Barlow","Trebuchet MS",Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;font-variant-ligatures:none!important}
[hidden]{display:none!important}
body{width:100%;overflow:hidden;background:var(--ink);color:var(--bone);font:400 17px/1.55 var(--body);margin:0;font-variant-ligatures:none}
a{color:var(--foam)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:2px solid var(--lichen);outline-offset:2px}
.wrap{max-width:1240px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet{display:none!important}
h1{font:700 clamp(46px,7vw,76px)/.95 var(--display);margin:0;color:var(--bone);letter-spacing:.005em}
.stage{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:12px}
.screen{position:fixed;inset:0;z-index:10;width:100vw;max-width:100vw;height:100dvh;aspect-ratio:auto;background:#06141a;border:1px solid var(--line);overflow:hidden;min-width:0}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
.ov{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(6,20,26,.62);overflow:auto;z-index:3}
.ov.pick{background:rgba(7,12,24,.96);align-items:flex-start}
.card.sel{max-width:1200px}
.weapon-icon{position:static;width:44px;height:44px;flex:none;image-rendering:pixelated;cursor:default;background:#111b30;border:1px solid var(--line)}
.mrow.weapon-row{grid-template-columns:minmax(0,1fr) auto auto auto}
.weapon-choice{display:flex;align-items:center;gap:12px}.weapon-choice div{flex:1}
.sel-top{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;justify-content:space-between;margin-bottom:10px}
.card .sel-top h2{margin:0;font-size:clamp(22px,2.6vw,32px)}
.tabs{display:flex;flex-wrap:wrap;gap:4px}
.tab{background:var(--deep);border:1px solid var(--line);padding:4px 12px;font-weight:700;font-size:15px}
.tab[aria-pressed="true"]{background:var(--lichen);border-color:var(--lichen);color:#1a1405}
.sel-body{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:12px;align-items:start}
.roster{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:5px}
.rc{min-width:0;padding:0;overflow:hidden}
.rc i{display:block;flex:none;background-image:var(--atlas);background-repeat:no-repeat}
/* Signature passive line on the character menu */
.passive{margin:-2px 0 10px;padding:6px 8px;border-left:3px solid var(--lichen);background:rgba(240,194,60,.08);font-size:14px;line-height:1.35;color:var(--bone)}.passive b{color:var(--lichen)}
/* Heroes and villains: the cards from the update sheets, with the number tab below */
.rc.h{display:flex;flex-direction:column;align-items:center;background:transparent;border:2px solid transparent;border-radius:3px}
.rc.h:hover{border-color:var(--foam)}
.rc.h[aria-pressed="true"]{border-color:var(--lichen);box-shadow:0 0 0 1px var(--lichen)}
.rc.h b{display:block;color:#f0dfa8;font:700 14px/1.25 var(--display)}
.detail{background:var(--deep);border:1px solid var(--line);padding:10px;display:grid;gap:6px;min-width:0;position:sticky;top:0}
.pv{display:flex;flex-direction:column;align-items:center;gap:2px;background:#8f9a94;background:linear-gradient(#a3a39a,#8d8d86);padding:2px 0}
.pv canvas{position:static;width:96px;height:96px;image-rendering:pixelated;cursor:default}
.pv .ctl{color:#14203a!important;font-weight:700}
.cont{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;background:var(--shelf);border:1px solid var(--lichen);padding:6px 10px;margin-bottom:10px}
.cont .go{padding:5px 16px;font-size:15px}
.mhead{margin:0 0 8px!important;color:var(--mist)!important}
.mlist{margin-bottom:12px}
.mrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:4px 12px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.mrow strong{display:block;line-height:1.2}
.mrow span{color:var(--mist);font-size:14px;line-height:1.25;display:block}
.mrow em{font:500 12px var(--mono);color:var(--lichen);font-style:normal;white-space:nowrap}
.skill-group{margin:20px 0 6px;color:var(--lichen);font-size:15px}.mrow.skill-row{padding:10px 0}.mrow .skill-progress{height:5px;max-width:220px;margin-top:6px;background:#26394b}.skill-progress i{display:block;height:100%;background:var(--lichen)}
.mrow.weapon-row{padding:10px;margin-bottom:8px;border:1px solid var(--line);background:rgba(14,26,43,.88)}
.weapon-info{min-width:0}.mrow .weapon-tier{display:flex;align-items:center;gap:7px;margin:3px 0;color:var(--bone);font:600 11px var(--mono)}
.mrow .weapon-pips{display:flex;gap:4px}.weapon-pips i{display:block;width:14px;height:6px;border:1px solid #83a8ba;background:transparent}.weapon-pips i.on{background:var(--lichen);border-color:var(--lichen)}
.mrow .weapon-effect{color:#a6e2dc}.mrow .weapon-reason{color:#f0c48c}
.achievement-card{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;padding:12px;margin:8px 0;border:1px solid var(--line);background:#101c2e}.achievement-card .medal{display:grid;place-items:center;width:40px;height:40px;border:1px solid #64738a;color:#8190a4;font-size:22px}.achievement-card.earned{border-color:#a78736;background:#252617}.achievement-card.earned .medal{border-color:#f0c23c;color:#ffdc70;background:#4d3a13}.achievement-card strong,.achievement-card span{display:block}.achievement-card span{font-size:14px;color:var(--mist)}.achievement-card em{font:12px var(--mono);font-style:normal;color:#f0c23c;white-space:nowrap}
.achievement-toast{position:absolute;z-index:7;top:16px;right:16px;display:flex;align-items:center;gap:12px;max-width:min(350px,calc(100% - 32px));padding:12px 17px;background:linear-gradient(115deg,#172238,#2c291c);border:1px solid #e2b951;box-shadow:0 4px 28px #000b,0 0 20px #e2b95133;pointer-events:none;animation:achievement-in .35s ease-out}.achievement-toast .medal{display:grid;place-items:center;width:42px;height:42px;flex:none;color:#ffe086;background:#5a4113;border:1px solid #efc45b;font-size:25px}.achievement-toast small{display:block;color:#f2c862;font:700 10px var(--mono);letter-spacing:.1em;text-transform:uppercase}.achievement-toast strong{display:block;font:700 17px var(--display);line-height:1.2}@keyframes achievement-in{from{opacity:0;transform:translateY(-12px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){.achievement-toast{animation:none}}
.buy{background:var(--shelf);border:1px solid var(--foam);padding:4px 10px;min-width:76px;font-weight:700;font-size:14px}
.buy:hover:not(:disabled){background:var(--line)}
.buy:disabled{opacity:.45;cursor:not-allowed;border-color:var(--line)}
.detail .pt i{display:block;background-image:var(--atlas);background-repeat:no-repeat}
.detail h3{font:700 24px/1 var(--display);margin:0}
.detail .role{font:500 11px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--lichen)}
.detail p{font-size:14px;line-height:1.3;margin:0;color:var(--bone)}
.detail .ctl{color:var(--mist);font-size:12.5px}
.detail .go{width:100%;font-size:17px;padding:8px}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ghost{background:transparent;border:1px solid var(--line);padding:9px 16px;font-weight:700}
.ghost:hover{border-color:var(--foam)}
.sheet-who{display:flex;gap:10px;align-items:flex-end}
.sheet-who i{display:block;flex:none;background-image:var(--atlas);background-repeat:no-repeat}
.card{min-width:0;max-width:540px;width:100%;margin:auto;text-align:left}
.card h2{font:700 clamp(32px,5vw,50px)/1 var(--display);margin:0 0 8px}
.card p{margin:0 0 14px;color:var(--bone)}
.keys{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:4px 16px;margin:0 0 16px;padding:0;list-style:none;font-size:15px;color:var(--mist)}
.keys b{font:500 12px var(--mono);color:var(--lichen);display:inline-block;min-width:60px}
.go{background:var(--coral);color:#fff;border:0;padding:10px 22px;font-weight:700;font-size:18px}
.go:hover{background:#ff6a5f}
.boons{display:grid;gap:8px;margin-top:10px}
.boon{display:flex;gap:12px;align-items:baseline;text-align:left;background:var(--deep);border:1px solid var(--line);padding:10px 14px}
.boon:hover{border-color:var(--lichen);background:var(--shelf)}
.boon kbd{font:500 12px var(--mono);color:var(--lichen)}
.boon strong{display:block;font-size:18px}
.boon span{color:var(--mist);font-size:15px}
.touch{position:absolute;right:max(8px,env(safe-area-inset-right,0px));bottom:max(8px,env(safe-area-inset-bottom,0px));display:grid;grid-template-columns:repeat(3,54px);gap:6px;z-index:2;pointer-events:none}
.touch button{height:54px;border-radius:50%;border:1px solid var(--foam);background:rgba(18,48,58,.82);font:700 11px var(--body);padding:2px;touch-action:none;pointer-events:auto;user-select:none;-webkit-user-select:none}
.touch button:active,.touch button.held{background:rgba(63,117,133,.95);border-color:var(--lichen)}
.touch button{position:relative}.touch button[data-state="waiting"]{color:#b3bac4;border-color:#7c8998;background:rgba(25,35,45,.82)}.touch button[data-state="ready"]{border-color:#f0c23c}.touch button[data-status]:not([data-status=""])::after{content:attr(data-status);position:absolute;bottom:1px;left:0;right:0;font:700 9px/1 var(--mono);color:#f5d78b}
.joystick{position:absolute;width:92px;height:92px;margin:-46px 0 0 -46px;border:2px solid rgba(190,225,244,.65);border-radius:50%;background:rgba(12,32,48,.25);pointer-events:none;z-index:2}
.joystick i{position:absolute;left:50%;top:50%;width:34px;height:34px;margin:-17px;border-radius:50%;background:rgba(190,225,244,.7);border:2px solid #eef8ff}
.touch .big{background:rgba(240,128,92,.55);border-color:var(--coral)}
.scout-revive{position:absolute;left:50%;bottom:90px;transform:translateX(-50%);z-index:3;padding:12px 20px;border:1px solid #80e5aa;border-radius:8px;background:#12343a;color:#fff;font:700 14px var(--body);touch-action:none}
.fx3{z-index:1;pointer-events:none}
.fx3b{top:calc(216px*var(--k,1))!important}
.menub{top:calc(160px*var(--k,1))!important}
.fsb{top:calc(188px*var(--k,1))!important}
.ov:not(.pick) .card{zoom:var(--k,1)}
/* ---------- Game-style notices: downed, stage clear, victory, pause ----------
   A dark stone plate with a glowing frame in the notice's colour, a kicker between rules, a big title that
   slams in with a shine, stat plates, and a tinted vignette behind. */
.ov[data-tone]{background:radial-gradient(ellipse at center,rgba(6,12,20,.55),rgba(3,6,12,.9))}
.ov[data-tone="dead"]{background:radial-gradient(ellipse at center,rgba(40,6,10,.45),rgba(16,2,4,.92))}
.ov[data-tone="win"]{background:radial-gradient(ellipse at center,rgba(40,30,6,.4),rgba(10,7,2,.9))}
.card.notice{--tone:#8fc4ff;--tone2:#2c4a6e;text-align:center;max-width:520px;padding:26px 24px 22px;background:linear-gradient(180deg,#1b1f2b,#0e1118 70%);border:2px solid var(--tone);border-radius:6px;
  box-shadow:0 0 0 4px #0a0c12,0 0 0 6px var(--tone2),0 0 38px color-mix(in srgb,var(--tone) 45%,transparent),inset 0 0 40px rgba(0,0,0,.6);position:relative;animation:noticeIn .5s cubic-bezier(.2,1.4,.4,1) both}
.card.notice[data-tone="dead"]{--tone:#e8463f;--tone2:#5a1a1c}.card.notice[data-tone="win"]{--tone:#f0c23c;--tone2:#5a4614}
.card.notice::before,.card.notice::after{content:"";position:absolute;top:50%;width:14px;height:14px;background:var(--tone);transform:translateY(-50%) rotate(45deg);box-shadow:0 0 10px var(--tone)}
.card.notice::before{left:-9px}.card.notice::after{right:-9px}
.notice-k{display:flex;align-items:center;gap:10px;justify-content:center;font:600 12px var(--mono);letter-spacing:.22em;text-transform:uppercase;color:var(--tone);margin-bottom:6px}
.notice-k::before,.notice-k::after{content:"";flex:1;max-width:90px;height:2px;background:linear-gradient(90deg,transparent,var(--tone))}.notice-k::after{transform:scaleX(-1)}
.card.notice .notice-t{font:700 clamp(34px,7vw,58px)/1 var(--display);margin:4px 0 10px;text-transform:uppercase;letter-spacing:.04em;color:#fff;
  background:linear-gradient(180deg,#fff 0%,var(--tone) 75%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
  filter:drop-shadow(0 3px 0 #000) drop-shadow(0 0 14px color-mix(in srgb,var(--tone) 55%,transparent));animation:noticeTitle .7s .1s cubic-bezier(.2,1.6,.4,1) both}
.notice-l{color:var(--bone);font-size:15px;line-height:1.4;margin:0 auto 14px;max-width:420px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:0 0 18px}
.chip{display:grid;min-width:84px;padding:7px 10px;background:#0a0c12;border:1px solid var(--tone2);border-radius:4px;box-shadow:inset 0 0 12px rgba(0,0,0,.6);animation:noticeIn .4s both}
.chip:nth-child(2){animation-delay:.08s}.chip:nth-child(3){animation-delay:.16s}
.chip b{font:700 21px/1.15 var(--mono);color:var(--tone)}.chip small{font:500 10px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--mist)}
.card.notice .btnrow{justify-content:center}
.card.notice .go{background:linear-gradient(180deg,color-mix(in srgb,var(--tone) 85%,#fff),color-mix(in srgb,var(--tone) 70%,#000));color:#120c06;border:2px solid #0a0c12;box-shadow:0 0 0 2px var(--tone),0 4px 0 #000;text-transform:uppercase;letter-spacing:.06em;font-family:Barlow,sans-serif;font-weight:700;transition:transform .12s,filter .12s}
.card.notice .go:hover,.card.notice .go:focus-visible{transform:translateY(-2px) scale(1.04);filter:brightness(1.15)}
@keyframes noticeIn{from{opacity:0;transform:scale(.82)}to{opacity:1;transform:none}}
@keyframes noticeTitle{0%{opacity:0;transform:scale(1.9);letter-spacing:.3em}60%{opacity:1}100%{transform:none}}
@media(prefers-reduced-motion:reduce){.card.notice,.card.notice .notice-t,.chip{animation:none}}
@media(max-width:480px){.card.notice{padding:20px 14px 16px}.chip{min-width:70px}.card.notice .btnrow{flex-direction:column;align-items:stretch}}
.screen:fullscreen{width:100vw;height:100vh;aspect-ratio:auto;border:0}
.screen:-webkit-full-screen{width:100vw;height:100vh;aspect-ratio:auto;border:0}
.sound{position:absolute;right:10px;top:calc(132px*var(--k,1));z-index:2;background:rgba(12,32,38,.7);border:1px solid var(--line);font:500 calc(11px*var(--k,1)) var(--mono);padding:3px 7px;color:var(--mist)}
.sheet{background:var(--deep);border:1px solid var(--line);padding:14px;overflow:auto;height:0;min-height:100%;font-size:15px}
.sheet h2{font:700 21px/1 var(--display);margin:0}
.sub{color:var(--mist);margin:2px 0 10px;font-size:14px}
.sheet h3{font:500 11px var(--mono);letter-spacing:.09em;text-transform:uppercase;color:var(--lichen);margin:14px 0 5px}
.stats{display:grid;grid-template-columns:1fr auto;gap:0 10px;margin:0;font-variant-numeric:tabular-nums}
.stats dt{color:var(--mist)} .stats dd{margin:0;text-align:right;font-family:var(--mono);font-size:13px}
.items{list-style:none;margin:0;padding:0;display:grid;gap:5px}
.items li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 6px;align-items:center;line-height:1.25;padding-bottom:5px;border-bottom:1px solid rgba(44,90,100,.55)}
.items li:last-child{border-bottom:0}
.iname{font-weight:700;min-width:0}
.iinfo{grid-column:1/-1;color:var(--mist);font-size:13px}
.empty{color:var(--mist);font-style:italic}
.acts{display:flex;gap:3px}
.acts button{background:var(--shelf);border:1px solid var(--line);font-size:12px;padding:1px 6px}
.acts button:hover{border-color:var(--foam)}
.r0{color:#d9d4c2}.r1{color:#7cc7f2}.r2{color:#e8c95c}.r3{color:#ff8f6b}
.sbs{display:grid;gap:2px}
.sb{display:grid;grid-template-columns:62px 1fr;align-items:center;font-size:12px;color:var(--mist)}
.sb i{display:flex;gap:2px}
.sb b,.sb u{display:block;width:100%;height:7px;background:var(--lichen)}.sb u{background:var(--line)}
.wrow.on{background:rgba(240,194,60,.1);box-shadow:inset 2px 0 0 var(--lichen)}
.wrow{padding-left:6px}
.gone{display:none!important}
.acts em{font:500 11px var(--mono);font-style:normal;color:var(--lichen)}
.baghead{display:flex;justify-content:space-between;align-items:center}
.baghead button{background:var(--shelf);border:1px solid var(--line);font:500 11px var(--body);letter-spacing:0;text-transform:none;color:var(--bone);padding:1px 7px}
.up{color:var(--foam);font:500 12px var(--mono)} .down{color:var(--coral);font:500 12px var(--mono)}
.log{list-style:none;margin:0;padding:0;font-size:13px;color:var(--mist);display:grid;gap:2px}

@media(max-width:940px){
  .stage{grid-template-columns:minmax(0,1fr)}
  .sheet{height:auto;min-height:0}
}
/* Title poster: the first screen. The owner's poster, the DAYRIM letters cut from the title art, and the Play Game button. */
/* ---------- Game modes screen ---------- */
.modes{position:absolute;inset:0;z-index:6;display:grid;grid-template-columns:clamp(250px,26vw,350px) minmax(0,1fr);grid-template-rows:minmax(0,1fr);background:#07060c;overflow:hidden}
.md-art{position:absolute;inset:0;background:#0a0a12 center/cover no-repeat;filter:saturate(1.05) brightness(.82);transition:opacity .6s ease}
.md-art2{opacity:0}.md-art2.on{opacity:1}
.md-vid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1;background:#000}
.modes.wz::after{background:linear-gradient(90deg,rgba(5,6,12,.85) 0,rgba(5,6,12,.2) 30%,rgba(5,6,12,0) 60%)}
.md-panel.wz{align-self:end;width:min(440px,calc(100% - 2*clamp(8px,2.4vh,22px)));background:rgba(10,13,24,.82)}
.modes::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(90deg,rgba(5,6,12,.9) 0,rgba(5,6,12,.55) 30%,rgba(5,6,12,.05) 60%,rgba(5,6,12,.4) 100%)}
.md-side{position:relative;z-index:2;display:flex;flex-direction:column;gap:18px;min-height:0;overflow:auto;padding:clamp(14px,3vh,30px) clamp(14px,1.6vw,22px);padding-left:max(clamp(14px,1.6vw,22px),env(safe-area-inset-left,0px));background:linear-gradient(180deg,rgba(16,17,28,.93),rgba(8,9,16,.97));border-right:1px solid #4a3a26;box-shadow:8px 0 30px #000a}
.md-logo{width:100%;max-width:290px;align-self:center;filter:drop-shadow(0 4px 10px #000);user-select:none;pointer-events:none}
.md-nav{display:flex;flex-direction:column;gap:10px;margin:auto 0}
.md-panel{position:relative;z-index:2;justify-self:start;align-self:stretch;margin:clamp(8px,2.4vh,22px);width:min(760px,calc(100% - 2*clamp(8px,2.4vh,22px)));padding:clamp(12px,2vw,22px);overflow:auto;min-height:0;background:rgba(10,13,24,.95);border:1px solid var(--line);box-shadow:0 10px 40px #000c}
.mp-head{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.mp-head h2{margin:0;font:700 clamp(24px,3vw,36px)/1 var(--display)}
.mp-back{padding:5px 12px;font-size:14px}
.mp-kick{margin:0 0 6px;font:600 12px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--lichen)}
.mp-lede{margin:0 0 12px;font-size:15px;line-height:1.5;color:var(--bone)}
.mp-h{margin:14px 0 8px;font:700 17px var(--display);color:var(--bone)}
.mp-note{margin:10px 0 0;font-size:13px;line-height:1.45;color:var(--mist)}
.mp-save{display:flex;align-items:center;gap:12px;margin-top:12px;padding:10px 12px;background:var(--deep);border:1px solid #c9973f}

/* Dark fantasy touch controls: labels stay visible alongside their symbols. */
.touch button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;border:2px solid #b88743;border-radius:50%;color:#f9efd6;background:radial-gradient(circle at 40% 22%,rgba(91,72,48,.97),rgba(24,20,17,.96) 70%);box-shadow:inset 0 0 0 2px #291c14,0 2px 4px #000b;text-shadow:0 1px 2px #000;font:700 10px/1 var(--body)}
.touch .touch-icon{font:700 17px/1.05 sans-serif;color:#f2c66d;pointer-events:none}.touch .touch-label{pointer-events:none}
.touch button[data-status]:not([data-status=""])::after{position:static;font:700 9px/1 var(--mono);color:#ffe09a}
.touch button[data-status]:not([data-status=""]) .touch-icon{font-size:13px}
.touch button[data-state="waiting"]{color:#d9cbb5;border-color:#806c50;background:radial-gradient(circle at 40% 22%,#494139,#201e1b 75%)}
.touch button[data-state="waiting"] .touch-icon{color:#b7a58a}.touch button[data-state="ready"]{border-color:#ffe08a;box-shadow:inset 0 0 0 2px #503519,0 0 7px #e1ac4a}
.touch button:active,.touch button.held{color:#fff;border-color:#fff0b4;background:radial-gradient(circle,#8a6232,#382316);box-shadow:inset 0 1px 6px #000,0 0 7px #e1ac4a}
.touch button:focus-visible{outline:3px solid #fff0b4;outline-offset:2px}
.touch-primary .big{flex-direction:row;gap:5px;border-radius:22px!important;border-color:#e4a24e;background:linear-gradient(#a83e28,#702417);font-size:13px;box-shadow:inset 0 0 0 2px #5c2419,0 2px 5px #000b}
.touch-primary .big .touch-icon{font-size:20px}.touch-extra{border:1px solid #b88743;background:rgba(24,20,17,.96);box-shadow:0 2px 6px #000b}
.touch button[data-a="revive"].nearby{border-color:#a7e6a6;background:radial-gradient(circle,#417843,#183921);box-shadow:0 0 0 2px #a7e6a688}
.joystick{border-color:#d4a867;background:rgba(50,37,23,.5);box-shadow:inset 0 0 0 3px #3b291a,0 2px 5px #0008}.joystick i{background:#b39561;border-color:#f3d293}
/* Dragging the stick far out sprints: the ring glows while it does. */
.joystick.sprint{border-color:#8fffe0;box-shadow:inset 0 0 0 3px #1d4a42,0 0 14px rgba(143,255,224,.65)}.joystick.sprint i{background:#6fd6c0;border-color:#d8fff4}
/* Ability and Use show the character's own move names; long names shrink to fit. */
.touch-ability .touch-label{font-size:10px;line-height:1.05;max-width:46px;overflow-wrap:anywhere}.touch-ability .touch-label.long{font-size:8.5px}
/* Landscape phones: Ability and Use stand in a column beside the main buttons instead of a row on top, so the controls stay low. */
@media(orientation:landscape) and (max-height:500px){.touch-ability{flex-direction:column;bottom:max(8px,env(safe-area-inset-bottom));right:calc(max(8px,env(safe-area-inset-right)) + 4*48px + 3*4px + 6px)}}

/* ---------- Medieval adventure theme for the menu pages ----------
   Story, Changelog and Warzone panels (.md-panel) and the character select and in-game menus (.ov.pick .card.sel):
   leather-and-stone panels with a bronze inlay, Cinzel lettering like the DAYRIM logo, and plaque buttons. */
.md-panel,.ov.pick .card.sel,.ov.pick .detail{border:0;color:#e8dcc4;
  background:radial-gradient(ellipse 120% 50% at 50% 0,rgba(120,80,40,.2),rgba(0,0,0,0) 60%),var(--stone,none) center/320px,linear-gradient(180deg,#1d150e,#0f0a06);background-blend-mode:normal,soft-light,normal;
  box-shadow:inset 0 0 0 1px #0d0906,inset 0 0 0 2px #8a6a3c,inset 0 0 0 4px #24180e,inset 0 0 0 5px #5c4426,0 12px 40px #000c}

.mp-kick,.ov.pick .detail .role{font-family:"Cinzel",serif;font-weight:700;letter-spacing:.14em;color:#c9a26a}
.mp-h,.mp-cht b{font-family:"Cinzel",serif;font-weight:900;letter-spacing:.04em;color:#f0e2c4}

  background:linear-gradient(180deg,#3e2f20,#1a120b);box-shadow:inset 0 0 0 1px #0d0906,inset 0 0 0 2px #7a5c34,inset 0 0 0 3px #24180e,inset 0 8px 12px rgba(255,210,150,.08);transition:filter .15s ease}

.mp-ch,.mp-save,.ov.pick .cont,.mp-char{border:0;color:#e8dcc4;background:linear-gradient(180deg,rgba(62,47,32,.85),rgba(26,18,11,.9));box-shadow:inset 0 0 0 1px #0d0906,inset 0 0 0 2px #5c4426,inset 0 6px 10px rgba(255,210,150,.05)}
