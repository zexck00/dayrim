# Dev: dayrim-dev.calypso.dedyn.io, image built from dev.
#
#   docker compose -p dayrim-dev -f deploy/compose.dev.yml --env-file ~/dayrim/dev.env up -d --no-build
#
# Its own volume, so a dev wipe can never touch a player's saves on production.

name: dayrim-dev

services:
  dayrim:
    image: ${DAYRIM_IMAGE:-ghcr.io/zexck00/dayrim:dev}
    container_name: dayrim-dev
    restart: unless-stopped
    environment:
      TRUST_PROXY: ${TRUST_PROXY:-1}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-https://${DAYRIM_HOST:-}}
      MAX_ROOMS: ${MAX_ROOMS:-10}
      MAX_PLAYERS_PER_ROOM: ${MAX_PLAYERS_PER_ROOM:-4}
      MAX_CONNECTIONS: ${MAX_CONNECTIONS:-80}
      MAX_CONNECTIONS_PER_IP: ${MAX_CONNECTIONS_PER_IP:-8}
    volumes:
      - dayrim-dev-data:/data
    networks:
      - traefik_default
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_default"
      - "traefik.http.routers.dayrim-dev.rule=Host(`${DAYRIM_HOST:-dayrim-dev.calypso.dedyn.io}`)"
      - "traefik.http.routers.dayrim-dev.entrypoints=websecure"
      - "traefik.http.routers.dayrim-dev.middlewares=basic-security@file"
      - "traefik.http.services.dayrim-dev.loadbalancer.server.port=8080"

volumes:
  dayrim-dev-data:

networks:
  traefik_default:
    external: true
